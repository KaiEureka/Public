<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="{{class}}">
<header class="topbar">
  <button class="bar-btn menu-btn" id="menu-btn" aria-label="目录">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="bar-title" href="index.html">{{book}}</a>
  <div class="search">
    <input id="search" type="search" placeholder="搜索全书（按 / 键）" autocomplete="off" aria-label="搜索全书">
    <div class="search-results" id="search-results" hidden></div>
  </div>
  {{pdf}}
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar">
{{sidebar}}
  </nav>
  <div class="scrim" id="scrim"></div>
  <main>
    <article class="content">
{{body}}
    </article>
  </main>
</div>
<script src="assets/app.js"></script>
</body>
</html>
