<text x="76.0" y="170.0" font-size="11.5" text-anchor="start" fill="#52606d"><tspan>总长 22 个单位，其中每个阶段空等 6 个：气泡 = 6/22 ≈ 27%，与 GPipe 相同</tspan></text>
<text x="76.0" y="190.0" font-size="11.5" text-anchor="start" fill="#52606d"><tspan>但阶段 0 同一时刻最多只保存 4 个 micro-batch 的激活值（= </tspan><tspan font-family="LatinSerif" font-style="italic">p</tspan><tspan>），GPipe 要存 8 个（= </tspan><tspan font-family="LatinSerif" font-style="italic">m</tspan><tspan>）</tspan></text>
<text x="330.0" y="208.0" font-size="11" text-anchor="middle" fill="#6b7785"><tspan>1F1B 调度（4 个阶段，8 个 micro-batch，前向和反向都按 1 个单位时间计）</tspan></text>
</svg>
