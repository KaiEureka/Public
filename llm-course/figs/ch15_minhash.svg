<svg viewBox="0 0 660 244" xmlns="http://www.w3.org/2000/svg" font-family="BookSans" font-size="13" style="width:165.0mm;max-width:100%">

<text x="10.0" y="18.0" font-size="11.5" text-anchor="start" fill="#1d2329"><tspan>文档 A：to be or not to be that is the question</tspan></text>
<text x="340.0" y="18.0" font-size="11.5" text-anchor="start" fill="#1d2329"><tspan>文档 B：to be or not to be this is the question</tspan></text>
<text x="10.0" y="40.0" font-size="11" text-anchor="start" fill="#6b3fa0" font-weight="700"><tspan>共有的 3 词片段（5 个）</tspan></text>
<rect x="10.0" y="46.0" width="53.8" height="20.0" rx="3" fill="#f5f0fb" stroke="#6b3fa0" stroke-width="1"/>
<text x="36.9" y="59.3" font-size="11" text-anchor="middle" fill="#1d2329"><tspan>to be or</tspan></text>
<rect x="67.8" y="46.0" width="59.7" height="20.0" rx="3" fill="#f5f0fb" stroke="#6b3fa0" stroke-width="1"/>
<text x="97.7" y="59.3" font-size="11" text-anchor="middle" fill="#1d2329"><tspan>be or not</tspan></text>
<rect x="131.5" y="46.0" width="59.7" height="20.0" rx="3" fill="#f5f0fb" stroke="#6b3fa0" stroke-width="1"/>
<text x="161.4" y="59.3" font-size="11" text-anchor="middle" fill="#1d2329"><tspan>or not to</tspan></text>
<rect x="195.3" y="46.0" width="59.7" height="20.0" rx="3" fill="#f5f0fb" stroke="#6b3fa0" stroke-width="1"/>
<text x="225.2" y="59.3" font-size="11" text-anchor="middle" fill="#1d2329"><tspan>not to be</tspan></text>
<rect x="259.0" y="46.0" width="89.7" height="20.0" rx="3" fill="#f5f0fb" stroke="#6b3fa0" stroke-width="1"/>
<text x="303.9" y="59.3" font-size="11" text-anchor="middle" fill="#1d2329"><tspan>is the question</tspan></text>
<text x="10.0" y="84.0" font-size="11" text-anchor="start" fill="#1c5d99" font-weight="700"><tspan>只在 A 中（3 个）</tspan></text>
<rect x="10.0" y="90.0" width="65.7" height="20.0" rx="3" fill="#e8eff6" stroke="#1c5d99" stroke-width="1"/>
<text x="42.8" y="103.3" font-size="11" text-anchor="middle" fill="#1d2329"><tspan>to be that</tspan></text>
<rect x="79.7" y="90.0" width="62.8" height="20.0" rx="3" fill="#e8eff6" stroke="#1c5d99" stroke-width="1"/>
<text x="111.1" y="103.3" font-size="11" text-anchor="middle" fill="#1d2329"><tspan>be that is</tspan></text>
<rect x="146.5" y="90.0" width="68.8" height="20.0" rx="3" fill="#e8eff6" stroke="#1c5d99" stroke-width="1"/>
<text x="180.9" y="103.3" font-size="11" text-anchor="middle" fill="#1d2329"><tspan>that is the</tspan></text>
<text x="340.0" y="84.0" font-size="11" text-anchor="start" fill="#c77d12" font-weight="700"><tspan>只在 B 中（3 个）</tspan></text>
<rect x="340.0" y="90.0" width="62.8" height="20.0" rx="3" fill="#fff8ec" stroke="#c77d12" stroke-width="1"/>
<text x="371.4" y="103.3" font-size="11" text-anchor="middle" fill="#1d2329"><tspan>to be this</tspan></text>
<rect x="406.8" y="90.0" width="60.0" height="20.0" rx="3" fill="#fff8ec" stroke="#c77d12" stroke-width="1"/>
<text x="436.8" y="103.3" font-size="11" text-anchor="middle" fill="#1d2329"><tspan>be this is</tspan></text>
<rect x="470.8" y="90.0" width="65.9" height="20.0" rx="3" fill="#fff8ec" stroke="#c77d12" stroke-width="1"/>
<text x="503.7" y="103.3" font-size="11" text-anchor="middle" fill="#1d2329"><tspan>this is the</tspan></text>
<text x="10.0" y="134.0" font-size="12" text-anchor="start" fill="#1d2329" font-weight="700"><tspan>Jaccard = 交集 ÷ 并集 = 5 ÷ 11 ≈ 0.45</tspan></text>
<text x="10.0" y="162.0" font-size="11.5" text-anchor="start" fill="#1d2329"><tspan>用一个随机哈希函数给并集里的 11 个片段排序，看排在第一位的是谁：</tspan></text>
<rect x="10.0" y="170.0" width="48.2" height="18.0" rx="3" fill="#f5f0fb" stroke="#6b3fa0" stroke-width="1"/>
<text x="34.1" y="181.8" font-size="9.5" text-anchor="middle" fill="#1d2329"><tspan>or not to</tspan></text>
<rect x="7.0" y="167.0" width="54.2" height="24.0" rx="4" fill="none" stroke="#b5443a" stroke-width="1.6"/>
<rect x="60.7" y="170.0" width="53.4" height="18.0" rx="3" fill="#e8eff6" stroke="#1c5d99" stroke-width="1"/>
<text x="87.4" y="181.8" font-size="9.5" text-anchor="middle" fill="#1d2329"><tspan>to be that</tspan></text>
<rect x="116.6" y="170.0" width="56.0" height="18.0" rx="3" fill="#e8eff6" stroke="#1c5d99" stroke-width="1"/>
<text x="144.6" y="181.8" font-size="9.5" text-anchor="middle" fill="#1d2329"><tspan>that is the</tspan></text>
<rect x="175.1" y="170.0" width="48.4" height="18.0" rx="3" fill="#fff8ec" stroke="#c77d12" stroke-width="1"/>
<text x="199.3" y="181.8" font-size="9.5" text-anchor="middle" fill="#1d2329"><tspan>be this is</tspan></text>
<rect x="226.0" y="170.0" width="43.1" height="18.0" rx="3" fill="#f5f0fb" stroke="#6b3fa0" stroke-width="1"/>
<text x="247.6" y="181.8" font-size="9.5" text-anchor="middle" fill="#1d2329"><tspan>to be or</tspan></text>
<rect x="271.6" y="170.0" width="50.9" height="18.0" rx="3" fill="#fff8ec" stroke="#c77d12" stroke-width="1"/>
<text x="297.1" y="181.8" font-size="9.5" text-anchor="middle" fill="#1d2329"><tspan>to be this</tspan></text>
<rect x="325.0" y="170.0" width="53.6" height="18.0" rx="3" fill="#fff8ec" stroke="#c77d12" stroke-width="1"/>
<text x="351.8" y="181.8" font-size="9.5" text-anchor="middle" fill="#1d2329"><tspan>this is the</tspan></text>
<rect x="381.1" y="170.0" width="50.9" height="18.0" rx="3" fill="#e8eff6" stroke="#1c5d99" stroke-width="1"/>
<text x="406.5" y="181.8" font-size="9.5" text-anchor="middle" fill="#1d2329"><tspan>be that is</tspan></text>
<rect x="434.5" y="170.0" width="48.2" height="18.0" rx="3" fill="#f5f0fb" stroke="#6b3fa0" stroke-width="1"/>
<text x="458.6" y="181.8" font-size="9.5" text-anchor="middle" fill="#1d2329"><tspan>be or not</tspan></text>
<rect x="485.2" y="170.0" width="74.1" height="18.0" rx="3" fill="#f5f0fb" stroke="#6b3fa0" stroke-width="1"/>
<text x="522.2" y="181.8" font-size="9.5" text-anchor="middle" fill="#1d2329"><tspan>is the question</tspan></text>
<rect x="561.8" y="170.0" width="48.2" height="18.0" rx="3" fill="#f5f0fb" stroke="#6b3fa0" stroke-width="1"/>
<text x="585.9" y="181.8" font-size="9.5" text-anchor="middle" fill="#1d2329"><tspan>not to be</tspan></text>
<text x="10.0" y="210.0" font-size="11.5" text-anchor="start" fill="#52606d"><tspan>排第一的片段同时是 A 和 B 的最小值。它落在交集里的概率恰好是 5/11 = Jaccard。</tspan></text>
<text x="10.0" y="228.0" font-size="11.5" text-anchor="start" fill="#52606d"><tspan>换 </tspan><tspan font-family="LatinSerif" font-style="italic">k</tspan><tspan> 个哈希函数重复，两篇文档最小值相同的比例就是 Jaccard 的估计（示意：这里用 3 个词一组，实际用 5 个）</tspan></text>
</svg>
