<rect x="185.2" y="34.0" width="52.2" height="26.0" rx="3" fill="#c77d12" stroke="none" stroke-width="0"/>
<text x="211.3" y="51.0" font-size="10.5" text-anchor="middle" fill="#ffffff"><tspan>拼参数 2</tspan></text>
<rect x="240.4" y="68.0" width="52.2" height="26.0" rx="3" fill="#1c5d99" stroke="none" stroke-width="0"/>
<text x="266.5" y="85.0" font-size="10.5" text-anchor="middle" fill="#ffffff"><tspan>前向 2</tspan></text>
<rect x="240.4" y="34.0" width="52.2" height="26.0" rx="3" fill="#c77d12" stroke="none" stroke-width="0"/>
<text x="266.5" y="51.0" font-size="10.5" text-anchor="middle" fill="#ffffff"><tspan>拼参数 3</tspan></text>
<rect x="295.6" y="68.0" width="52.2" height="26.0" rx="3" fill="#1c5d99" stroke="none" stroke-width="0"/>
<text x="321.7" y="85.0" font-size="10.5" text-anchor="middle" fill="#ffffff"><tspan>前向 3</tspan></text>
<rect x="295.6" y="34.0" width="52.2" height="26.0" rx="3" fill="#c77d12" stroke="none" stroke-width="0"/>
<text x="321.7" y="51.0" font-size="10.5" text-anchor="middle" fill="#ffffff"><tspan>拼参数 4</tspan></text>
<rect x="350.8" y="68.0" width="52.2" height="26.0" rx="3" fill="#1c5d99" stroke="none" stroke-width="0"/>
<text x="376.9" y="85.0" font-size="10.5" text-anchor="middle" fill="#ffffff"><tspan>前向 4</tspan></text>
<text x="130.0" y="22.0" font-size="11" text-anchor="start" fill="#1d2329"><tspan>前向：all-gather 第 k 层的完整参数 → 计算 → 立即释放；算第 k 层时预取第 k+1 层</tspan></text>
<text x="130.0" y="140.0" font-size="11" text-anchor="start" fill="#1d2329"><tspan>反向：再 all-gather 一次参数 → 算梯度 → reduce-scatter 把梯度分给各卡 → 释放</tspan></text>
<text x="130.0" y="162.0" font-size="11" text-anchor="start" fill="#52606d"><tspan>通信量约 3Ψ，是数据并行的 1.5 倍；显存峰值 ≈ 自己的切片 + 一两个完整 block</tspan></text>
<text x="330.0" y="190.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan>ZeRO-3 / FSDP 的前向过程（示意）：拼参数和计算错开一步，通信被计算掩盖</tspan></text>
</svg>
