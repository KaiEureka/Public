<svg viewBox="0 0 660 142" xmlns="http://www.w3.org/2000/svg" font-family="BookSans" font-size="13" style="width:165.0mm;max-width:100%">

<text x="10.0" y="18.0" font-size="11.5" text-anchor="start" fill="#1d2329" font-weight="700"><tspan>一个 batch 里有两条样本：A 的回答 10 个 token，B 的回答 990 个 token</tspan></text>
<text x="10.0" y="51.0" font-size="11.5" text-anchor="start" fill="#1d2329"><tspan>对全部 token 求平均</tspan></text>
<rect x="220.0" y="34.0" width="4.2" height="26.0" rx="0" fill="#c77d12" stroke="none" stroke-width="0"/>
<rect x="224.2" y="34.0" width="415.8" height="26.0" rx="0" fill="#1c5d99" stroke="none" stroke-width="0"/>
<text x="224.0" y="31.0" font-size="10.5" text-anchor="start" fill="#c77d12"><tspan>A：1%</tspan></text>
<text x="432.1" y="52.0" font-size="11" text-anchor="middle" fill="#ffffff"><tspan>B：99%</tspan></text>
<text x="10.0" y="95.0" font-size="11.5" text-anchor="start" fill="#1d2329"><tspan>先对每条样本求平均，再平均</tspan></text>
<rect x="220.0" y="78.0" width="210.0" height="26.0" rx="0" fill="#c77d12" stroke="none" stroke-width="0"/>
<rect x="430.0" y="78.0" width="210.0" height="26.0" rx="0" fill="#1c5d99" stroke="none" stroke-width="0"/>
<text x="325.0" y="96.0" font-size="11" text-anchor="middle" fill="#ffffff"><tspan>A：50%</tspan></text>
<text x="535.0" y="96.0" font-size="11" text-anchor="middle" fill="#ffffff"><tspan>B：50%</tspan></text>
<text x="330.0" y="136.0" font-size="11" text-anchor="middle" fill="#52606d"><tspan>两条样本在 loss 中所占的权重。前一种做法让长回答占的比重大得多（例子）</tspan></text>
</svg>
