<svg viewBox="0 0 660 200" xmlns="http://www.w3.org/2000/svg" font-family="BookSans" font-size="13" style="width:165.0mm;max-width:100%">

<rect x="20.0" y="30.0" width="130.0" height="130.0" rx="2" fill="#eef1f4" stroke="#9aa7b4" stroke-width="1.2"/>
<text x="85.0" y="91.0" font-size="16" text-anchor="middle" fill="#1d2329"><tspan font-family="LatinSerif" font-style="italic">W</tspan></text>
<text x="85.0" y="111.0" font-size="11" text-anchor="middle" fill="#52606d"><tspan>冻结</tspan></text>
<text x="85.0" y="22.0" font-size="11" text-anchor="middle" fill="#52606d"><tspan font-family="LatinSerif" font-style="italic">d</tspan><tspan font-family="LatinSerif"> </tspan><tspan font-family="LatinSerif">×</tspan><tspan font-family="LatinSerif"> </tspan><tspan font-family="LatinSerif" font-style="italic">d</tspan></text>
<text x="170.0" y="100.0" font-size="20" text-anchor="middle" fill="#52606d"><tspan>+</tspan></text>
<rect x="192.0" y="30.0" width="16.0" height="130.0" rx="2" fill="#c77d12" stroke="none" stroke-width="0"/>
<text x="200.0" y="22.0" font-size="11" text-anchor="middle" fill="#52606d"><tspan font-family="LatinSerif" font-style="italic">B</tspan><tspan>：</tspan><tspan font-family="LatinSerif" font-style="italic">d</tspan><tspan font-family="LatinSerif"> </tspan><tspan font-family="LatinSerif">×</tspan><tspan font-family="LatinSerif"> </tspan><tspan font-family="LatinSerif" font-style="italic">r</tspan></text>
<text x="222.0" y="100.0" font-size="16" text-anchor="middle" fill="#52606d"><tspan>×</tspan></text>
<rect x="236.0" y="88.0" width="130.0" height="16.0" rx="2" fill="#c77d12" stroke="none" stroke-width="0"/>
<text x="301.0" y="80.0" font-size="11" text-anchor="middle" fill="#52606d"><tspan font-family="LatinSerif" font-style="italic">A</tspan><tspan>：</tspan><tspan font-family="LatinSerif" font-style="italic">r</tspan><tspan font-family="LatinSerif"> </tspan><tspan font-family="LatinSerif">×</tspan><tspan font-family="LatinSerif"> </tspan><tspan font-family="LatinSerif" font-style="italic">d</tspan></text>
<text x="301.0" y="124.0" font-size="11" text-anchor="middle" fill="#c77d12" font-weight="700"><tspan>只训练 </tspan><tspan font-family="LatinSerif" font-style="italic">A</tspan><tspan> 和 </tspan><tspan font-family="LatinSerif" font-style="italic">B</tspan></text>
<text x="400.0" y="52.0" font-size="11.5" text-anchor="start" fill="#1d2329" font-weight="700"><tspan>以 </tspan><tspan font-family="LatinSerif" font-style="italic">d</tspan><tspan> = 4096、</tspan><tspan font-family="LatinSerif" font-style="italic">r</tspan><tspan> = 16 为例：</tspan></text>
<text x="400.0" y="76.0" font-size="11.5" text-anchor="start" fill="#52606d"><tspan font-family="LatinSerif" font-style="italic">W</tspan><tspan>：</tspan><tspan font-family="LatinSerif">4096</tspan><tspan font-family="LatinSerif" font-size="8.3" baseline-shift="0.42em">2</tspan><tspan> ≈ 1,678 万个参数</tspan></text>
<text x="400.0" y="98.0" font-size="11.5" text-anchor="start" fill="#52606d"><tspan font-family="LatinSerif" font-style="italic">A</tspan><tspan> 和 </tspan><tspan font-family="LatinSerif" font-style="italic">B</tspan><tspan>：</tspan><tspan font-family="LatinSerif">2</tspan><tspan font-family="LatinSerif">×</tspan><tspan font-family="LatinSerif">4096</tspan><tspan font-family="LatinSerif">×</tspan><tspan font-family="LatinSerif">16</tspan><tspan> ≈ 13.1 万个</tspan></text>
<text x="400.0" y="120.0" font-size="11.5" text-anchor="start" fill="#c77d12" font-weight="700"><tspan>只占 0.78%</tspan></text>
<text x="400.0" y="150.0" font-size="11" text-anchor="start" fill="#52606d"><tspan>不同任务各存一组小的 </tspan><tspan font-family="LatinSerif" font-style="italic">A</tspan><tspan>、</tspan><tspan font-family="LatinSerif" font-style="italic">B</tspan><tspan>，</tspan></text>
<text x="400.0" y="164.8" font-size="11" text-anchor="start" fill="#52606d"><tspan>用时“挂”到同一个基座模型上</tspan></text>
<text x="330.0" y="194.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan>LoRA：</tspan><tspan font-family="LatinSerif" font-style="italic">W</tspan><tspan>′ = </tspan><tspan font-family="LatinSerif" font-style="italic">W</tspan><tspan font-family="LatinSerif"> + </tspan><tspan font-family="LatinSerif" font-style="italic">BA</tspan><tspan>，矩阵的形状按比例画出（</tspan><tspan font-family="LatinSerif" font-style="italic">r</tspan><tspan font-family="LatinSerif"> </tspan><tspan font-family="LatinSerif">≪</tspan><tspan font-family="LatinSerif"> </tspan><tspan font-family="LatinSerif" font-style="italic">d</tspan><tspan>）</tspan></text>
</svg>
