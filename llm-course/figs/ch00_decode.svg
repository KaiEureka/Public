<svg viewBox="0 0 660 200" xmlns="http://www.w3.org/2000/svg" font-family="BookSans" font-size="13" style="width:165.0mm;max-width:100%">
<defs><marker id="ch00_decode-ah-1c5d99" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c5d99"/></marker><marker id="ch00_decode-ah-6b7785" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker></defs>
<rect x="10.0" y="30.0" width="210.0" height="120.0" rx="6" fill="#e8eff6" stroke="#1c5d99" stroke-width="1.2"/>
<text x="115.0" y="52.0" font-size="13" text-anchor="middle" fill="#1d2329" font-weight="700"><tspan>显存（HBM）</tspan></text>
<rect x="28.0" y="66.0" width="30.0" height="44.0" rx="2" fill="#9cbbd9" stroke="#1c5d99" stroke-width="1"/>
<rect x="64.0" y="66.0" width="30.0" height="44.0" rx="2" fill="#9cbbd9" stroke="#1c5d99" stroke-width="1"/>
<rect x="100.0" y="66.0" width="30.0" height="44.0" rx="2" fill="#9cbbd9" stroke="#1c5d99" stroke-width="1"/>
<rect x="136.0" y="66.0" width="30.0" height="44.0" rx="2" fill="#9cbbd9" stroke="#1c5d99" stroke-width="1"/>
<rect x="172.0" y="66.0" width="30.0" height="44.0" rx="2" fill="#9cbbd9" stroke="#1c5d99" stroke-width="1"/>
<text x="115.0" y="132.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan>全部权重：Llama 3 8B 约 16 GB</tspan></text>
<rect x="390.0" y="30.0" width="160.0" height="120.0" rx="6" fill="#fff8ec" stroke="#c77d12" stroke-width="1.2"/>
<text x="470.0" y="52.0" font-size="13" text-anchor="middle" fill="#1d2329" font-weight="700"><tspan>计算单元</tspan></text>
<text x="470.0" y="80.0" font-size="12" text-anchor="middle" fill="#52606d"><tspan>989 TFLOP/s</tspan></text>
<text x="470.0" y="104.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan>每个 token 只需</tspan></text>
<text x="470.0" y="120.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan>约 </tspan><tspan font-family="LatinSerif">2</tspan><tspan font-family="LatinSerif" font-style="italic">N</tspan><tspan> = 160 亿次运算</tspan></text>
<path d="M224.0,90.0 L386.0,90.0" fill="none" stroke="#1c5d99" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#ch00_decode-ah-1c5d99)"/>
<text x="305.0" y="80.0" font-size="12" text-anchor="middle" fill="#1d2329"><tspan>每生成 1 个 token</tspan></text>
<text x="305.0" y="110.0" font-size="12" text-anchor="middle" fill="#1d2329"><tspan>把 16 GB 全部读一遍</tspan></text>
<text x="305.0" y="126.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan>3.35 TB/s</tspan></text>
<rect x="590.0" y="74.0" width="60.0" height="32.0" rx="5" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="1.2"/>
<text x="620.0" y="93.6" font-size="12" text-anchor="middle" fill="#ffffff"><tspan>新 token</tspan></text>
<path d="M552.0,90.0 L588.0,90.0" fill="none" stroke="#6b7785" stroke-width="1.4" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#ch00_decode-ah-6b7785)"/>
<path d="M620.0,108.0 L620.0,168.0 L115.0,168.0 L115.0,154.0" fill="none" stroke="#6b7785" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ch00_decode-ah-6b7785)" stroke-dasharray="4 3"/>
<text x="370.0" y="190.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan>新 token 接到输入后面，再把全部权重读一遍，生成下一个</tspan></text>
<text x="330.0" y="18.0" font-size="12.5" text-anchor="middle" fill="#1d2329" font-weight="700"><tspan>瓶颈在读权重：最多 3,350 ÷ 16 ≈ 200 token/s，此时算力只用了峰值的 0.4%</tspan></text>
</svg>
