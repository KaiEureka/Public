<svg viewBox="0 0 660 165" xmlns="http://www.w3.org/2000/svg" font-family="BookSans" font-size="13" style="width:165.0mm;max-width:100%">

<text x="10.0" y="22.0" font-size="12.5" text-anchor="start" fill="#1d2329" font-weight="700"><tspan>Llama 3 8B 的 80.3 亿个参数在哪里</tspan></text>
