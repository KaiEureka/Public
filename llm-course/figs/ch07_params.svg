<text x="234.8" y="58.0" font-size="12" text-anchor="middle" fill="#ffffff"><tspan>32 层 MLP：56.4 亿</tspan></text>
<rect x="459.5" y="36.0" width="104.8" height="34.0" rx="2" fill="#c77d12" stroke="none" stroke-width="0"/>
<text x="459.5" y="88.0" font-size="11.5" text-anchor="start" fill="#c77d12"><tspan>注意力 13.4 亿</tspan></text>
<rect x="566.3" y="36.0" width="81.7" height="34.0" rx="2" fill="#2e7d4f" stroke="none" stroke-width="0"/>
<text x="648.0" y="88.0" font-size="11.5" text-anchor="end" fill="#2e7d4f"><tspan>嵌入 + 输出层 10.5 亿</tspan></text>
<text x="10.0" y="122.0" font-size="11.5" text-anchor="start" fill="#52606d"><tspan>约七成参数在 MLP 里；GQA 让注意力只占 17%。</tspan><tspan font-family="LatinSerif" font-style="italic">d</tspan><tspan font-family="LatinSerif" font-size="8.3" baseline-shift="-0.25em">ff</tspan><tspan> = 14,336 = 3.5</tspan><tspan font-family="LatinSerif" font-style="italic">d</tspan><tspan>，比 </tspan><tspan font-family="LatinSerif">8/3</tspan><tspan font-family="LatinSerif" font-style="italic">d</tspan><tspan> 宽一些</tspan></text>
<text x="10.0" y="144.0" font-size="11" text-anchor="start" fill="#6b7785"><tspan>（按 7.6 节的配置计算：每层 MLP 3 × 4,096 × 14,336 = 1.76 亿，每层注意力 0.42 亿）</tspan></text>
