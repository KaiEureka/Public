<svg viewBox="0 0 660 235" xmlns="http://www.w3.org/2000/svg" font-family="BookSans" font-size="13" style="width:165.0mm;max-width:100%">
<defs><marker id="ch07_rope-ah-c77d12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77d12"/></marker><marker id="ch07_rope-ah-1c5d99" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c5d99"/></marker></defs>
<text x="150.0" y="28.0" font-size="12" text-anchor="middle" fill="#1d2329" font-weight="700"><tspan>位置 </tspan><tspan font-family="LatinSerif" font-style="italic">m</tspan><tspan> = 5，</tspan><tspan font-family="LatinSerif" font-style="italic">n</tspan><tspan> = 3</tspan></text>
<circle cx="150.0" cy="128.0" r="70" fill="#fbfcfd" stroke="#e3e7eb" stroke-width="1"/>
<path d="M74.0,128.0 L226.0,128.0" fill="none" stroke="#e3e7eb" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M150.0,52.0 L150.0,204.0" fill="none" stroke="#e3e7eb" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M150.0,128.0 L162.2,59.1" fill="none" stroke="#c77d12" stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#ch07_rope-ah-c77d12)"/>
<text x="172.2" y="55.1" font-size="11.5" text-anchor="start" fill="#1d2329"><tspan font-family="LatinSerif" font-style="italic">q</tspan><tspan> 转 5 格</tspan></text>
<path d="M150.0,128.0 L212.4,96.2" fill="none" stroke="#1c5d99" stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#ch07_rope-ah-1c5d99)"/>
<text x="222.4" y="92.2" font-size="11.5" text-anchor="start" fill="#1d2329"><tspan font-family="LatinSerif" font-style="italic">k</tspan><tspan> 转 3 格</tspan></text>
<path d="M171.8,116.9 A24.5,24.5 0 0 0 154.3,103.9" fill="none" stroke="#2e7d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="420.0" y="28.0" font-size="12" text-anchor="middle" fill="#1d2329" font-weight="700"><tspan>两者都往后挪 4 个位置</tspan></text>
<circle cx="420.0" cy="128.0" r="70" fill="#fbfcfd" stroke="#e3e7eb" stroke-width="1"/>
<path d="M344.0,128.0 L496.0,128.0" fill="none" stroke="#e3e7eb" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M420.0,52.0 L420.0,204.0" fill="none" stroke="#e3e7eb" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M420.0,128.0 L369.6,79.4" fill="none" stroke="#c77d12" stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#ch07_rope-ah-c77d12)"/>
<text x="359.6" y="75.4" font-size="11.5" text-anchor="end" fill="#1d2329"><tspan font-family="LatinSerif" font-style="italic">q</tspan><tspan> 转 9 格</tspan></text>
<path d="M420.0,128.0 L428.5,58.5" fill="none" stroke="#1c5d99" stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#ch07_rope-ah-1c5d99)"/>
<text x="438.5" y="54.5" font-size="11.5" text-anchor="start" fill="#1d2329"><tspan font-family="LatinSerif" font-style="italic">k</tspan><tspan> 转 7 格</tspan></text>
<path d="M423.0,103.7 A24.5,24.5 0 0 0 402.4,111.0" fill="none" stroke="#2e7d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="285.0" y="132.0" font-size="20" text-anchor="middle" fill="#52606d"><tspan>→</tspan></text>
<text x="560.0" y="92.0" font-size="12" text-anchor="start" fill="#2e7d4f"><tspan>绿色夹角相同：</tspan></text>
<text x="560.0" y="108.2" font-size="12" text-anchor="start" fill="#2e7d4f"><tspan>点积只取决于</tspan></text>
<text x="560.0" y="124.4" font-size="12" text-anchor="start" fill="#2e7d4f"><tspan>相对位置 </tspan><tspan font-family="LatinSerif" font-style="italic">m</tspan><tspan font-family="LatinSerif"> − </tspan><tspan font-family="LatinSerif" font-style="italic">n</tspan></text>
<text x="330.0" y="228.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan>示意：位置每加 1，向量多转一格（一个固定角度）。实际有 </tspan><tspan font-family="LatinSerif" font-style="italic">d</tspan><tspan font-family="LatinSerif" font-style="italic" font-size="8.3" baseline-shift="-0.25em">h</tspan><tspan font-family="LatinSerif">/2</tspan><tspan> 个平面，每个平面的一格大小不同</tspan></text>
</svg>
