<text x="206.0" y="62.5" font-size="10.5" text-anchor="middle" fill="#1d2329"><tspan>层、头、神经元、维度</tspan></text>
<path d="M266.0,24.0 L382.0,24.0 L394.0,52.0 L382.0,80.0 L266.0,80.0 L278.0,52.0 L266.0,24.0" fill="#e8eff6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="334.0" y="48.8" font-size="10.5" text-anchor="middle" fill="#1d2329" font-weight="700"><tspan>剪掉不重要的部分</tspan></text>
<text x="334.0" y="62.5" font-size="10.5" text-anchor="middle" fill="#1d2329"><tspan>减宽度或减深度</tspan></text>
<path d="M394.0,24.0 L510.0,24.0 L522.0,52.0 L510.0,80.0 L394.0,80.0 L406.0,52.0 L394.0,24.0" fill="#e8eff6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="462.0" y="48.8" font-size="10.5" text-anchor="middle" fill="#1d2329" font-weight="700"><tspan>logits 蒸馏</tspan></text>
<text x="462.0" y="62.5" font-size="10.5" text-anchor="middle" fill="#1d2329"><tspan>大模型当教师</tspan></text>
<path d="M522.0,24.0 L638.0,24.0 L650.0,52.0 L638.0,80.0 L522.0,80.0 L534.0,52.0 L522.0,24.0" fill="#2e7d4f" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
