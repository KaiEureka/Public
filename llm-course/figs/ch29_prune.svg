<text x="72.0" y="62.5" font-size="10.5" text-anchor="middle" fill="#ffffff"><tspan>Nemotron-15B</tspan></text>
<path d="M138.0,24.0 L254.0,24.0 L266.0,52.0 L254.0,80.0 L138.0,80.0 L150.0,52.0 L138.0,24.0" fill="#e8eff6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
