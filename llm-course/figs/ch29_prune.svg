<text x="590.0" y="62.5" font-size="10.5" text-anchor="middle" fill="#ffffff"><tspan>8B、4B</tspan></text>
<text x="330.0" y="112.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan>与从零训练相比，每个小模型所需的训练 token 最多减少到约 1/40；</tspan></text>
<text x="330.0" y="130.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan>同样的目标大小下，减宽度通常比减深度效果更好（Minitron，NVIDIA，2024）</tspan></text>
<text x="330.0" y="156.0" font-size="11" text-anchor="middle" fill="#6b7785"><tspan>Llama 3.2 的 1B、3B 也是从 8B 剪枝再蒸馏得到的</tspan></text>
