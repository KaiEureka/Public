<text x="208.0" y="144.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan font-family="LatinSerif" font-style="italic">dW</tspan><tspan font-family="LatinSerif" font-size="8.3" baseline-shift="-0.25em">1</tspan><tspan font-family="LatinSerif"> = </tspan><tspan font-family="LatinSerif" font-style="italic">x</tspan><tspan font-family="LatinSerif" font-style="italic" font-size="8.3" baseline-shift="0.42em">T</tspan><tspan font-family="LatinSerif" font-style="italic">da</tspan><tspan>，</tspan><tspan font-family="LatinSerif" font-style="italic">db</tspan><tspan font-family="LatinSerif" font-size="8.3" baseline-shift="-0.25em">1</tspan><tspan font-family="LatinSerif"> = </tspan><tspan font-family="LatinSerif">Σ</tspan><tspan font-family="LatinSerif"> </tspan><tspan font-family="LatinSerif" font-style="italic">da</tspan></text>
<text x="493.0" y="144.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan font-family="LatinSerif" font-style="italic">dW</tspan><tspan font-family="LatinSerif" font-size="8.3" baseline-shift="-0.25em">2</tspan><tspan font-family="LatinSerif"> = </tspan><tspan font-family="LatinSerif" font-style="italic">h</tspan><tspan font-family="LatinSerif" font-style="italic" font-size="8.3" baseline-shift="0.42em">T</tspan><tspan font-family="LatinSerif" font-style="italic">d</tspan><tspan font-family="LatinSerif"> </tspan><tspan>logits</tspan></text>
<text x="330.0" y="184.0" font-size="12" text-anchor="middle" fill="#c77d12"><tspan>反向（橙色箭头）：从 loss 往回，按链式法则逐个求梯度；每个节点下方是它的梯度公式</tspan></text>
<text x="330.0" y="206.0" font-size="11.5" text-anchor="middle" fill="#52606d"><tspan>最后一步得到所有参数（E、</tspan><tspan font-family="LatinSerif" font-style="italic">W</tspan><tspan font-family="LatinSerif" font-size="8.3" baseline-shift="-0.25em">1</tspan><tspan>、</tspan><tspan font-family="LatinSerif" font-style="italic">b</tspan><tspan font-family="LatinSerif" font-size="8.3" baseline-shift="-0.25em">1</tspan><tspan>、</tspan><tspan font-family="LatinSerif" font-style="italic">W</tspan><tspan font-family="LatinSerif" font-size="8.3" baseline-shift="-0.25em">2</tspan><tspan>、</tspan><tspan font-family="LatinSerif" font-style="italic">b</tspan><tspan font-family="LatinSerif" font-size="8.3" baseline-shift="-0.25em">2</tspan><tspan>）的梯度，用来更新参数</tspan></text>
